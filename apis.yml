apis:
- name: Appify Platform REST API
  description: 'The Appify platform''s tenant-facing REST API. Appify''s public pricing page
    lists "REST API access" among the standard capabilities included in a subscription. The
    API is served from the platform application host and requires authentication: unauthenticated
    requests to /api/v1 return HTTP 403 with an empty body (Spring Security), while sibling
    non-API paths return HTTP 404, confirming the route exists. No public API reference or
    machine-readable specification is published — a Springfox Swagger UI shell is served at
    /swagger-ui.html but every springfox document endpoint (/v2/api-docs, /v3/api-docs,
    /swagger-resources) returns 404 and /api/v1/openapi.json returns 403.'
  humanURL: https://www.appify.com/platform
  baseURL: https://login.appify.com/api/v1
  tags:
  - Application Development
  - No Code
  - Enterprise Software
  x-access: gated
  x-evidence:
    fetched: '2026-08-06'
    probes:
    - url: https://login.appify.com/api/v1
      http_status: 403
    - url: https://login.appify.com/api/v1/openapi.json
      http_status: 403
    - url: https://login.appify.com/swagger-ui.html
      http_status: 200
    - url: https://login.appify.com/v2/api-docs
      http_status: 404
    - url: https://www.appify.com/pricing
      http_status: 200
